[build]
  publish = "static"

[[redirects]]
  from = "/static/*"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "https://bpcl-registration.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://bpcl-registration.onrender.com/uploads/:splat"
  status = 200
  force = true
